[workspace]
members = [
    "crates/nexus-core",
    "crates/nexus-cli",
    "crates/nexus-bench",
    "crates/nexus-gui",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

# Tests exercise megabyte-scale roundtrips; unoptimized codecs make them crawl.
[profile.dev.package.nexus-core]
opt-level = 2

[profile.test.package.nexus-core]
opt-level = 2
