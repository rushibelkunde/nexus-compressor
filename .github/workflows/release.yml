name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer & Portable ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --bin nexus --bin nexus-gui

      - name: Package Windows ZIP Distribution
        run: powershell -ExecutionPolicy Bypass -File scripts\package_release.ps1 -Version "${{ github.ref_name }}"

      - name: Compile Inno Setup Windows Installer (.exe)
        run: |
          choco install innosetup -y
          iscc scripts\windows\nexus.iss
        continue-on-error: true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.exe

  build-linux:
    name: Build Ubuntu / Linux (.deb & .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --bin nexus --bin nexus-gui

      - name: Package Linux tarball (.tar.gz)
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          PKG_NAME="NEXUS-v${VERSION}-Linux-x64"
          mkdir -p "dist/${PKG_NAME}"
          cp target/release/nexus "dist/${PKG_NAME}/"
          cp target/release/nexus-gui "dist/${PKG_NAME}/"
          cp assets/nexus_logo.png "dist/${PKG_NAME}/nexus.png"
          cp scripts/linux/install.sh "dist/${PKG_NAME}/"
          cp scripts/linux/uninstall.sh "dist/${PKG_NAME}/"
          cp scripts/linux/nexus.desktop "dist/${PKG_NAME}/"
          cp scripts/linux/nexus.xml "dist/${PKG_NAME}/"
          chmod +x "dist/${PKG_NAME}/install.sh" "dist/${PKG_NAME}/uninstall.sh"
          
          # Create README
          cat > "dist/${PKG_NAME}/README.txt" << 'EOF'
          NEXUS Archiver for Linux / Ubuntu
          =================================
          To install:
            ./install.sh
          
          To uninstall:
            ./uninstall.sh
          EOF

          tar -czvf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"

      - name: Build Ubuntu/Debian .deb package
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DEB_DIR="dist/deb_build"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/local/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${DEB_DIR}/usr/share/mime/packages"

          cp target/release/nexus "${DEB_DIR}/usr/local/bin/"
          cp target/release/nexus-gui "${DEB_DIR}/usr/local/bin/"
          cp assets/nexus_logo.png "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps/nexus.png"
          cp scripts/linux/nexus.desktop "${DEB_DIR}/usr/share/applications/"
          cp scripts/linux/nexus.xml "${DEB_DIR}/usr/share/mime/packages/"

          cat > "${DEB_DIR}/DEBIAN/control" << EOF
          Package: nexus-archiver
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: NEXUS Team <https://github.com/rushibelkunde/nexus-compressor>
          Description: Neural EXtreme Unified compresSion (NEXUS) Archiver
           High-performance, multi-strategy next-generation compression engine
           with presets, custom levels (1-19), and native GUI.
          EOF

          dpkg-deb --build "${DEB_DIR}" "dist/nexus_${VERSION}_amd64.deb"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/*.tar.gz
            dist/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXUS Archiver ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.zip
            release_assets/*.exe
            release_assets/*.tar.gz
            release_assets/*.deb
